spring:
  application:
    name: flashticket-backend

  # Configuração padrão (H2 em modo de compatibilidade PostgreSQL para rodar imediatamente sem exigir Docker aberto)
  datasource:
    url: jdbc:h2:mem:flashticket;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # TÓPICO: MIGRATIONS COM FLYWAY
  # O Flyway executa os scripts de src/main/resources/db/migration em ordem (V1__, V2__...)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # TÓPICO: BOAS PRÁTICAS JPA EM PRODUÇÃO
  # ddl-auto: validate garante que o Hibernate NUNCA crie ou altere tabelas sozinho;
  # ele apenas valida se as entidades Java batem 100% com as tabelas criadas pelo Flyway!
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

---
# Profile 'postgres' para usar com o container Docker (docker compose up -d)
# Para ativar: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=postgres
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/flashticket
    username: flashticket
    password: flashticket_secret
    driver-class-name: org.postgresql.Driver

spring:
  application:
    name: flashticket-backend

  # Por padrão (sem Docker aberto), desativamos a conexão automática ao container Mongo/Redis
  # e usamos os Adapters em memória + Caffeine Cache (com TTL de 5 min).
  autoconfigure:
    exclude:
      - org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

  # Configuração padrão (H2 em modo de compatibilidade PostgreSQL para rodar imediatamente sem exigir Docker aberto)
  datasource:
    url: jdbc:h2:mem:flashticket;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # TÓPICO: MIGRATIONS COM FLYWAY
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # TÓPICO: BOAS PRÁTICAS JPA EM PRODUÇÃO
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        session_factory:
          statement_inspector: com.flashticket.infrastructure.persistence.jpa.HibernateSqlCounter

  # TÓPICO (Fase 3): GraphQL e interface interativa GraphiQL (/graphiql)
  graphql:
    path: /graphql
    graphiql:
      enabled: true

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

---
# Profile 'postgres' ou 'docker' para usar com os containers Docker (PostgreSQL + MongoDB + Redis)
# Para ativar: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=postgres"
spring:
  config:
    activate:
      on-profile: postgres,docker
  autoconfigure:
    exclude: []
  datasource:
    url: jdbc:postgresql://localhost:5432/flashticket
    username: flashticket
    password: flashticket_secret
    driver-class-name: org.postgresql.Driver
  data:
    mongodb:
      uri: mongodb://localhost:27017/flashticket_audit
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379
